<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="龚曦 · 全栈开发 / 个人博客">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080c14"/>
      <stop offset="1" stop-color="#0c1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.45" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00d9b8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#00d9b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9b8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00d9b8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#00d9b8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- 60px grid overlay -->
  <g stroke="#00d9b8" stroke-opacity="0.05" stroke-width="1">
    <path d="M60 0V630M120 0V630M180 0V630M240 0V630M300 0V630M360 0V630M420 0V630M480 0V630M540 0V630M600 0V630M660 0V630M720 0V630M780 0V630M840 0V630M900 0V630M960 0V630M1020 0V630M1080 0V630M1140 0V630"/>
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200M0 360H1200M0 420H1200M0 480H1200M0 540H1200"/>
  </g>

  <!-- accent line -->
  <rect x="80" y="250" width="120" height="3" fill="url(#line)"/>

  <!-- logo mark -->
  <text x="80" y="150" font-family="'JetBrains Mono', monospace" font-size="26" fill="#00d9b8" letter-spacing="2">~/gongxi</text>

  <!-- main name -->
  <text x="76" y="370" font-family="Syne, sans-serif" font-size="108" font-weight="800" fill="#e2e8f0" letter-spacing="-2">龚曦</text>

  <!-- subtitle -->
  <text x="80" y="440" font-family="'JetBrains Mono', monospace" font-size="34" fill="#00d9b8" letter-spacing="1">Full-Stack Developer</text>

  <!-- tagline -->
  <text x="80" y="500" font-family="'DM Sans', sans-serif" font-size="26" fill="#94a3b8">全栈开发 / 个人博客 · Android &amp; Spring Boot</text>

  <!-- bottom bar -->
  <rect x="80" y="548" width="1040" height="1" fill="#00d9b8" opacity="0.15"/>
  <text x="80" y="582" font-family="'JetBrains Mono', monospace" font-size="20" fill="#334155">Java Backend · Android Native · Vue 3</text>
  <text x="1120" y="582" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="20" fill="#334155">portfolio</text>
